                let data2 = {

                $.ajax({
                    url: http1 + "GetLocationInfoListForInput",

                    // dataType: 'json',

                    data: JSON.stringify(data2),

                        var select = $("#LocationID");//TypeID为HTML标签ID
                        select.empty();
                        let result = res.data
                        // select.append(new Option("", ""));
                        $.each(result, function (index, item) {

                    if (value.length < 5) {
                        return '标题⾄少得5个字符啊';
                    }
                }, fname: function (value) {
                    if (value.length < 4) {
                        return '请输⼊⾄少4位的⽤户名';

                    if (value.length < 4) {

                    }
                }

                    parseData: function (res) { //res 即为原始返回的数据
                        return {
                            "code": 0,
                            "msg": "",
                            "count": 0,
                            "data": res.data
                        }
                    },

                        { type: 'numbers', field: 'boxIndex', title: '序号', align: "center", fixed: 'left' },
                        { field: 'ItemID', Width: "80", title: '物资编号', align: "center", },
                        { field: 'ItemType', Width: "80", title: '入库类型', align: "center", },
                        { field: 'ItemName', Width: "80", title: '物资名称', align: "center", },

                table.reload("tableId", {
